<div class="auth-page">
  <mat-card class="auth-card">
    <div class="brand">
      <mat-icon>auto_awesome</mat-icon>
      <span>DreamVault</span>
    </div>
    <p class="subtitle">Sign in to your personal dream & investment planner</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Create one</a></p>

    <div class="demo-hint">
      <strong>Demo accounts</strong>
      <div>Admin: sunilbgadakari&#64;gmail.com / Admin&#64;123</div>
      <div>User: demo.user&#64;dreamvault.local / User&#64;123</div>
    </div>
  </mat-card>
</div>
