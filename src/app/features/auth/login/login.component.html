<div class="auth-page">
  <mat-card class="auth-card">
    <div class="brand">
      <mat-icon>auto_awesome</mat-icon>
      <span>DreamVault</span>
    </div>
    <p class="subtitle">Sign in to your personal dream & investment planner</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>User ID / Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Create one</a></p>

    @if (showDemoCredentials) {
      <div class="demo-hint">
        <strong>Demo Credentials — Development only</strong>
        <button type="button" class="demo-row" (click)="fillDemoCredentials('admin', 'Admin@123')">
          <span class="demo-role">Admin</span>
          <span>User ID: <code>admin</code> &nbsp; Password: <code>Admin&#64;123</code></span>
        </button>
        <button type="button" class="demo-row" (click)="fillDemoCredentials('demo', 'Demo@123')">
          <span class="demo-role">User</span>
          <span>User ID: <code>demo</code> &nbsp; Password: <code>Demo&#64;123</code></span>
        </button>
      </div>
    }
  </mat-card>
</div>
