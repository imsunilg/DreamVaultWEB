<table mat-table [dataSource]="transactions" class="dv-table">
  @if (showStockColumn) {
    <ng-container matColumnDef="stockId">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let t">{{ stockLabel(t) }}</td>
    </ng-container>
  }

  <ng-container matColumnDef="transactionType">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let t">{{ t.transactionType }}</td>
  </ng-container>

  <ng-container matColumnDef="transactionDate">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let t">{{ t.transactionDate | date: 'mediumDate' }}</td>
  </ng-container>

  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef>Qty</th>
    <td mat-cell *matCellDef="let t">{{ t.quantity }}</td>
  </ng-container>

  <ng-container matColumnDef="pricePerShare">
    <th mat-header-cell *matHeaderCellDef>Price</th>
    <td mat-cell *matCellDef="let t">{{ t.pricePerShare | inr }}</td>
  </ng-container>

  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let t">{{ total(t) | inr }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let t">
      <button mat-icon-button (click)="deleteTransaction.emit(t.transactionId)" aria-label="Delete transaction">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (!transactions.length) {
  <p class="dv-disclaimer">No transactions yet.</p>
}
